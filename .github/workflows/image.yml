# On every push to main (including merged pull requests): check and test
# the code (unit tests, and end-to-end tests in a browser), build the
# Docker image (linux/amd64, which Bunny Magic Containers requires),
# publish it to GitHub's container registry as ghcr.io/<owner>/<repo>
# tagged "latest" and "sha-<commit>", then deploy
# that commit's image to the Magic Containers app. Pull requests are only
# checked and tested.
#
# Deploying needs, in the repository's Settings → Secrets and variables →
# Actions: the variable APP_ID (the Magic Containers app's ID) and the
# secret BUNNYNET_API_KEY (the main Bunny account's API key; sub-users
# aren't supported). Optionally the variable BUNNY_CONTAINER, the
# container's name inside the app (default "motis"). Without APP_ID the
# deploy is skipped.
name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  # The whole app in a real browser (WebKit, as in Safari): sign-up, a
  # meeting, justering, sharing, search. See e2e/ and playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  image:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && vars.APP_ID != ''
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the one running.
    concurrency:
      group: deploy-bunny
      cancel-in-progress: false
    steps:
      - name: Update container image on Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: ${{ vars.BUNNY_CONTAINER || 'motis' }}
          # The tag the image job published for this commit.
          image_tag: sha-${{ github.sha }}
