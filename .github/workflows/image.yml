# On every push to main (including merged pull requests): check and test
# the code (unit tests, and end-to-end tests in a browser), build the
# Docker image (linux/amd64, which Bunny Magic Containers requires),
# publish it to GitHub's container registry as ghcr.io/<owner>/<repo>
# tagged "latest" and "sha-<commit>", then deploy
# that commit's image to the Magic Containers app. Pull requests are only
# checked and tested.
#
# Deploying needs, in the repository's Settings → Secrets and variables →
# Actions: the variable APP_ID (the Magic Containers app's ID) and the
# secret BUNNYNET_API_KEY (the main Bunny account's API key; sub-users
# aren't supported). Optionally the variable BUNNY_CONTAINER, the
# container's name inside the app (default "motis"). Without APP_ID the
# deploy is skipped.
#
# Actions are pinned to a commit (the version in the comment), so a moved tag
# can't change what runs here; Dependabot keeps them up to date.
name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # The production build, so a pull request that breaks it is caught
      # before merging rather than when deploying.
      - run: pnpm build

  # The whole app in a real browser (WebKit, as in Safari): sign-up, a
  # meeting, justering, sharing, search. See e2e/ and playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image has WebKit and everything it needs installed;
    # keep its version the same as @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  image:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          # Always the latest node:22-slim, with its security fixes.
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && vars.APP_ID != ''
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the one running.
    concurrency:
      group: deploy-bunny
      cancel-in-progress: false
    steps:
      - name: Update container image on Magic Containers
        uses: BunnyWay/actions/container-update-image@931a74b9c45ea9f9f01435fbbf1649830e67d3b3 # main
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: ${{ vars.BUNNY_CONTAINER || 'motis' }}
          # The tag the image job published for this commit.
          image_tag: sha-${{ github.sha }}
